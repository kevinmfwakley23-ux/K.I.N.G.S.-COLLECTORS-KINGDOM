services:
  - type: web
    name: kings-collectors-kingdom
    runtime: node
    repo: https://github.com/kevinmfwakley23-ux/K.I.N.G.S.-COLLECTORS-KINGDOM
    branch: main
    plan: 0.5c-512mb
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: KINGDOM_HOST
        value: 0.0.0.0
      - key: KINGDOM_PORT
        value: "10000"
      - key: KINGDOM_DATA_DIR
        value: /var/data/kings-collectors-kingdom
      - key: KINGDOM_COOKIE_SECURE
        value: "true"
      - key: KINGDOM_KINGS_AI_BASE_URL
        sync: false
      - key: KINGDOM_KINGS_AI_TOKEN
        sync: false
    disk:
      name: kingdom-data
      mountPath: /var/data
      sizeGB: 1
