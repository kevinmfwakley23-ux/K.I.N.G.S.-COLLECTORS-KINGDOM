<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Kingdom Street Market</title>
  <desc id="desc">An elegant open-air collector street market outside white marble castle gates, with black and gold details, orderly vendor stalls, awnings, display cases, lanterns, and a broad pedestrian avenue.</desc>
